spring.application.name=stockflow-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=PT1H
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

stockflow.bootstrap.admin.enabled=${STOCKFLOW_BOOTSTRAP_ADMIN_ENABLED:false}
stockflow.bootstrap.admin.email=${STOCKFLOW_BOOTSTRAP_ADMIN_EMAIL:}
stockflow.bootstrap.admin.password=${STOCKFLOW_BOOTSTRAP_ADMIN_PASSWORD:}
stockflow.bootstrap.admin.first-name=${STOCKFLOW_BOOTSTRAP_ADMIN_FIRST_NAME:}
stockflow.bootstrap.admin.last-name=${STOCKFLOW_BOOTSTRAP_ADMIN_LAST_NAME:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
